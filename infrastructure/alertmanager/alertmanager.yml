route:
  # 按服务与告警名分组，推送到后端 Webhook
  receiver: incidentpilot
  group_by: [service, alertname]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  # 后端告警接入
  - name: incidentpilot
    webhook_configs:
      - url: http://backend:8000/api/v1/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook_token
